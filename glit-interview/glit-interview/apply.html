<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>인터뷰 신청 — Glit</title>
<meta name="theme-color" content="#FFFAF1" />
<meta name="description" content="에디토리얼 매거진 글릿(Glit) 인터뷰 신청" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<main class="apply">
  <a class="apply__back" href="./index.html">&larr; 소개로 돌아가기</a>

  <p class="step">INTERVIEW</p>
  <h1 class="headline">인터뷰 <em>신청하기</em></h1>
  <p class="lead">30분이면 충분해요.<br />연락드릴 수 있는 정보를 남겨주세요.</p>

  <form class="form" id="applyForm" novalidate>
    <label class="form__field">
      <span>이름 <b>*</b></span>
      <input type="text" name="name" required autocomplete="name" placeholder="이름을 입력해주세요" />
    </label>
    <label class="form__field">
      <span>전화번호 <small>(선택)</small></span>
      <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" />
    </label>
    <label class="form__field">
      <span>인스타 아이디 <small>(선택)</small></span>
      <input type="text" name="instagram" autocapitalize="none" autocorrect="off" placeholder="@your_id" />
    </label>
    <button class="form__submit" type="submit">신청하기</button>
    <p class="form__msg" id="formMsg" role="status" hidden></p>
  </form>

  <div class="apply__done" id="applyDone" hidden>
    <p class="apply__done-shout">신청 완료!</p>
    <p class="apply__done-sub">소중한 이야기, 잘 받았어요.<br />확인 후 연락드릴게요 :)</p>
    <a class="form__submit apply__home" href="./index.html">처음으로</a>
  </div>
</main>

<script>
// Google Apps Script 웹 앱 URL — 배포 후 발급되는 /exec 주소를 넣으세요.
const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxYiFBA4ijKmGbgxnTgDNM5YzJiOIUOYQItbVPjkIcU6j4pXXANLpcYzlZ--O4mvkUr/exec';

const form = document.getElementById('applyForm');
const msg = document.getElementById('formMsg');
const done = document.getElementById('applyDone');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = form.name.value.trim();
  if (!name) {
    msg.hidden = false;
    msg.textContent = '이름을 입력해주세요.';
    form.name.focus();
    return;
  }

  if (!SHEET_ENDPOINT) {
    msg.hidden = false;
    msg.textContent = '아직 접수 준비 중이에요. 인스타 DM(@gleamit_glit)으로 신청해주세요!';
    return;
  }

  const btn = form.querySelector('.form__submit');
  btn.disabled = true;
  btn.textContent = '전송 중…';
  msg.hidden = true;

  try {
    const body = new URLSearchParams();
    body.set('name', name);
    body.set('phone', form.phone.value.trim());
    body.set('instagram', form.instagram.value.trim());
    await fetch(SHEET_ENDPOINT, { method: 'POST', mode: 'no-cors', body });

    form.hidden = true;
    document.querySelector('.lead').hidden = true;
    done.hidden = false;
  } catch (err) {
    msg.hidden = false;
    msg.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
    btn.disabled = false;
    btn.textContent = '신청하기';
  }
});
</script>
</body>
</html>
